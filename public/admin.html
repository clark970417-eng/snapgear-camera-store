<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapGear Admin Panel | SQLite Database Console</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-standalone">
  <div style="max-width:1220px;margin:20px auto;padding:0 16px 40px;">
    <div class="gba-window" style="width:100%;max-height:none;">
      <div class="gba-win-head">
        <div>
          <div class="gba-win-title">🗄 SNAPGEAR CAMERA STORE — SQL ADMIN PANEL</div>
          <div class="gba-win-sub">Password-protected visual CRUD editor, live multi-statement SQL console, S/P/R/F transactions, and SQL export for <code>snapgear.db</code>.</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <a href="/" class="btn-gba sm primary" style="text-decoration:none;">← Back to Pixel Storefront</a>
        </div>
      </div>
      <div class="gba-win-body" id="standaloneAdminBody"></div>
    </div>
  </div>
  <div id="toast" role="alert"></div>

  <script type="module">
    import { SnapGearAdminPanel } from "/js/admin-ui.js";

    let timer = null;
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("on");
      clearTimeout(timer);
      timer = setTimeout(() => el.classList.remove("on"), 2600);
    }

    const panel = new SnapGearAdminPanel(document.getElementById("standaloneAdminBody"), {
      onToast: toast
    });
    panel.mount();
  </script>
</body>
</html>
