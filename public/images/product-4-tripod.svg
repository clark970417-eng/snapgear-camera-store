<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="studioBg" cx="46%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#f6f3ea"/>
      <stop offset="65%" stop-color="#efeae0"/>
      <stop offset="100%" stop-color="#e7e1d5"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a241c" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#2a241c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2a241c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matteBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d1e21"/>
      <stop offset="28%" stop-color="#35373c"/>
      <stop offset="52%" stop-color="#25272b"/>
      <stop offset="85%" stop-color="#17181b"/>
      <stop offset="100%" stop-color="#2a2c31"/>
    </linearGradient>
    <linearGradient id="legFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16171a"/>
      <stop offset="32%" stop-color="#3a3d43"/>
      <stop offset="62%" stop-color="#232529"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="legLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f3136"/>
      <stop offset="45%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="legRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3e44"/>
      <stop offset="40%" stop-color="#23252a"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b8f96"/>
      <stop offset="24%" stop-color="#e5e8ec"/>
      <stop offset="48%" stop-color="#a8adb5"/>
      <stop offset="76%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#767a82"/>
    </linearGradient>
    <radialGradient id="ballSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d8dce2"/>
      <stop offset="38%" stop-color="#858a92"/>
      <stop offset="78%" stop-color="#3f4248"/>
      <stop offset="100%" stop-color="#202226"/>
    </radialGradient>
    <radialGradient id="redButton" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ea4545"/>
      <stop offset="55%" stop-color="#c62228"/>
      <stop offset="100%" stop-color="#7f1216"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tightBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Seamless warm studio background -->
  <rect width="800" height="800" fill="url(#studioBg)"/>

  <!-- Grounded ambient and contact shadows under the three feet -->
  <ellipse cx="420" cy="642" rx="225" ry="44" fill="url(#floorShadow)" filter="url(#softBlur)"/>
  <ellipse cx="222" cy="616" rx="46" ry="13" fill="#1f1a14" opacity="0.28" filter="url(#tightBlur)"/>
  <ellipse cx="388" cy="662" rx="52" ry="14" fill="#1f1a14" opacity="0.34" filter="url(#tightBlur)"/>
  <ellipse cx="585" cy="612" rx="48" ry="13" fill="#1f1a14" opacity="0.28" filter="url(#tightBlur)"/>

  <!-- Back-left leg -->
  <g>
    <path d="M 358 372 C 318 424, 256 516, 200 598 C 192 610, 200 622, 214 622 C 228 622, 240 612, 250 598 C 296 534, 344 468, 384 412 Z" fill="url(#legLeft)"/>
    <!-- Inner sculpted facet -->
    <path d="M 366 394 C 330 446, 278 524, 232 592 C 228 598, 234 604, 242 598 C 288 534, 340 462, 380 408 Z" fill="#141518" opacity="0.72"/>
    <!-- Rubber foot tip -->
    <path d="M 200 598 C 192 610, 200 622, 214 622 C 224 622, 234 616, 241 607 L 210 584 Z" fill="#101114"/>
  </g>

  <!-- Back-right leg -->
  <g>
    <path d="M 442 372 C 482 424, 544 512, 598 592 C 606 604, 598 618, 584 618 C 570 618, 558 608, 548 594 C 502 530, 454 464, 416 410 Z" fill="url(#legRight)"/>
    <path d="M 442 376 C 482 428, 542 512, 594 590" stroke="#535760" stroke-width="2.5" fill="none" opacity="0.45"/>
    <!-- Rubber foot tip -->
    <path d="M 598 592 C 606 604, 598 618, 584 618 C 574 618, 564 612, 557 603 L 588 580 Z" fill="#101114"/>
  </g>

  <!-- Center-front sculpted leg (Manfrotto PIXI signature curved teardrop leg) -->
  <g>
    <path d="M 366 376 C 356 446, 348 552, 354 646 C 356 664, 372 672, 392 672 C 412 672, 426 662, 428 644 C 436 550, 434 446, 428 376 Z" fill="url(#legFront)"/>
    <!-- Subtle specular ridge along front leg -->
    <path d="M 382 396 C 378 466, 376 558, 380 648" stroke="#52565f" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.38"/>
    <!-- Subtle Manfrotto accent pill on front leg -->
    <rect x="378" y="454" width="24" height="5" rx="2.5" fill="#c62228" opacity="0.92"/>
    <!-- Rubber foot cap -->
    <path d="M 354 642 C 356 664, 372 672, 392 672 C 412 672, 426 662, 428 642 C 412 652, 372 652, 354 642 Z" fill="#0f1013"/>
  </g>

  <!-- Central tripod hub / collar housing -->
  <g>
    <!-- Lower rounded yoke -->
    <path d="M 342 324 C 342 292, 458 292, 458 324 L 452 386 C 446 410, 354 410, 348 386 Z" fill="url(#matteBody)"/>
    <!-- Top shoulder rim -->
    <ellipse cx="400" cy="316" rx="58" ry="20" fill="#2d3036"/>
    <ellipse cx="400" cy="314" rx="50" ry="15" fill="#181a1e"/>
    <!-- Hinge pin details -->
    <circle cx="352" cy="366" r="6" fill="#131417" stroke="#3c4048" stroke-width="1.5"/>
    <circle cx="448" cy="366" r="6" fill="#131417" stroke="#3c4048" stroke-width="1.5"/>

    <!-- Signature Manfrotto Circular Push-Button Lock (Red Ring + Embossed Dark Center) -->
    <circle cx="400" cy="358" r="24" fill="#121316"/>
    <circle cx="400" cy="358" r="21" fill="url(#redButton)"/>
    <circle cx="400" cy="358" r="16" fill="#202227"/>
    <circle cx="400" cy="358" r="14" fill="none" stroke="#454952" stroke-width="1.2"/>
    <!-- Subtle inner emblem dot -->
    <circle cx="400" cy="358" r="4.5" fill="#d92b30"/>
    <ellipse cx="395" cy="351" rx="6" ry="2.2" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- Stainless Steel Ball Joint Neck -->
  <g>
    <circle cx="400" cy="284" r="28" fill="url(#ballSphere)"/>
    <!-- Ball socket collar ring -->
    <ellipse cx="400" cy="308" rx="34" ry="10" fill="none" stroke="#444850" stroke-width="3"/>
    <!-- Neck stem -->
    <rect x="384" y="232" width="32" height="44" rx="4" fill="url(#metalSilver)"/>
    <rect x="384" y="264" width="32" height="5" fill="#52565e" opacity="0.5"/>
  </g>

  <!-- Camera Mount Platform Plate (Top Rubber Pad + Metallic Rim) -->
  <g>
    <!-- Plate side wall -->
    <path d="M 332 212 L 332 232 C 332 246, 468 246, 468 232 L 468 212 Z" fill="url(#matteBody)"/>
    <!-- Metallic knurled underside accent -->
    <path d="M 336 226 C 336 239, 464 239, 464 226 L 464 231 C 464 244, 336 244, 336 231 Z" fill="url(#metalSilver)" opacity="0.72"/>
    <!-- Plate top surface -->
    <ellipse cx="400" cy="212" rx="68" ry="20" fill="#2b2d33"/>
    <ellipse cx="400" cy="211" rx="60" ry="16" fill="#1a1c20"/>
    <!-- Rubber grip concentric groove -->
    <ellipse cx="400" cy="211" rx="44" ry="11" fill="none" stroke="#2f3239" stroke-width="2"/>
  </g>

  <!-- Precision 1/4"-20 Threaded Steel Camera Mount Screw -->
  <g>
    <ellipse cx="400" cy="208" rx="15" ry="5" fill="#70757e"/>
    <rect x="389" y="176" width="22" height="32" rx="2" fill="url(#metalSilver)"/>
    <!-- Thread grooves -->
    <g stroke="#5b6068" stroke-width="2" opacity="0.75">
      <line x1="389" y1="183" x2="411" y2="185"/>
      <line x1="389" y1="189" x2="411" y2="191"/>
      <line x1="389" y1="195" x2="411" y2="197"/>
      <line x1="389" y1="201" x2="411" y2="203"/>
    </g>
    <ellipse cx="400" cy="176" rx="11" ry="3.5" fill="#e8ecef"/>
  </g>
</svg>
